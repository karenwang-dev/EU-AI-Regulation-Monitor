<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - AI Regulation Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
        }

        .navbar-nav .nav-link.active {
            font-weight: 600;
            color: #fff !important;
        }

        .stat-card {
            min-height: 120px;
        }

        .stat-card .display-6 {
            font-size: 2rem;
        }

        .page-header {
            margin-bottom: 1.5rem;
        }

        .table td, .table th {
            vertical-align: middle;
        }

        .module-badge + .module-badge {
            margin-left: 0.25rem;
        }

        .diff-block {
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 0.5rem;
            padding: 1rem;
            white-space: pre-wrap;
            font-size: 0.875rem;
        }

        .diff-added {
            border-left: 4px solid #198754;
        }

        .diff-removed {
            border-left: 4px solid #dc3545;
        }
    </style>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container py-1">
        <a class="navbar-brand fw-semibold" href="/">AI Regulation Monitor</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
            aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto gap-lg-2">
                <li class="nav-item">
                    <a class="nav-link{% if active_page == 'dashboard' %} active{% endif %}" href="/">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link{% if active_page == 'monitors' %} active{% endif %}" href="/monitors">Monitors</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link{% if active_page == 'changes' %} active{% endif %}" href="/changes">Changes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link{% if active_page == 'manage' %} active{% endif %}" href="/manage-monitors">Manage Monitors</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<main class="container pb-5 px-3 px-md-4">
    {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
