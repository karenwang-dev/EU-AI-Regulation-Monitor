<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - AI Regulation Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
        }

        .navbar-nav .nav-link.active {
            font-weight: 600;
            color: #fff !important;
        }

        .stat-card {
            min-height: 120px;
        }

        .dashboard-stat-card {
            min-height: 108px;
        }

        .dashboard-stat-card .display-6 {
            font-size: 1.75rem;
            line-height: 1.1;
        }

        .stat-card-link {
            display: block;
            text-decoration: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .stat-card-link:hover,
        .stat-card-link:focus,
        .stat-card-link:active,
        .stat-card-link:visited {
            text-decoration: none;
        }

        .stat-card-link:hover {
            transform: translateY(-2px);
        }

        .stat-card-link:hover .dashboard-stat-card,
        .stat-card-link:focus-visible .dashboard-stat-card {
            box-shadow: 0 0.35rem 0.75rem rgba(0, 0, 0, 0.12);
        }

        .dashboard-risk-card.risk-high {
            --risk-color: var(--bs-danger);
            --risk-bg: rgba(var(--bs-danger-rgb), 0.08);
        }

        .dashboard-risk-card.risk-medium {
            --risk-color: #997404;
            --risk-bg: rgba(var(--bs-warning-rgb), 0.12);
        }

        .dashboard-risk-card.risk-low {
            --risk-color: var(--bs-success);
            --risk-bg: rgba(var(--bs-success-rgb), 0.08);
        }

        .dashboard-risk-card.risk-neutral {
            --risk-color: var(--bs-secondary);
            --risk-bg: transparent;
        }

        .dashboard-risk-card {
            border-color: var(--risk-color) !important;
            background-color: var(--risk-bg);
            transition: box-shadow 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
        }

        .dashboard-risk-card .risk-label,
        .dashboard-risk-card .risk-count,
        .dashboard-risk-card .risk-icon {
            color: var(--risk-color) !important;
        }

        .stat-card-link .dashboard-risk-card .risk-label,
        .stat-card-link .dashboard-risk-card .risk-count,
        .stat-card-link .dashboard-risk-card .risk-icon,
        .stat-card-link:hover .dashboard-risk-card .risk-label,
        .stat-card-link:hover .dashboard-risk-card .risk-count,
        .stat-card-link:hover .dashboard-risk-card .risk-icon,
        .stat-card-link:focus .dashboard-risk-card .risk-label,
        .stat-card-link:focus .dashboard-risk-card .risk-count,
        .stat-card-link:focus .dashboard-risk-card .risk-icon,
        .stat-card-link:active .dashboard-risk-card .risk-label,
        .stat-card-link:active .dashboard-risk-card .risk-count,
        .stat-card-link:active .dashboard-risk-card .risk-icon,
        .stat-card-link:visited .dashboard-risk-card .risk-label,
        .stat-card-link:visited .dashboard-risk-card .risk-count,
        .stat-card-link:visited .dashboard-risk-card .risk-icon {
            color: var(--risk-color) !important;
        }

        @media (prefers-reduced-motion: reduce) {
            .stat-card-link,
            .dashboard-stat-card,
            .dashboard-risk-card {
                transition: none;
            }

            .stat-card-link:hover {
                transform: none;
            }
        }

        .stat-card-link:focus-visible {
            outline: 2px solid #0d6efd;
            outline-offset: 2px;
        }

        .stat-card .display-6 {
            font-size: 2rem;
        }

        .page-header {
            margin-bottom: 1.5rem;
        }

        .table td, .table th {
            vertical-align: middle;
        }

        .module-badge + .module-badge {
            margin-left: 0.25rem;
        }

        .badge-relation-supersedes {
            background-color: #6f42c1;
            color: #fff;
        }

        .diff-block {
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 0.5rem;
            padding: 1rem;
            white-space: pre-wrap;
            font-size: 0.875rem;
        }

        .diff-added {
            border-left: 4px solid #198754;
        }

        .diff-removed {
            border-left: 4px solid #dc3545;
        }
    </style>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container py-1">
        <a class="navbar-brand fw-semibold" href="/">AI Regulation Monitor</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
            aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto gap-lg-2">
                <li class="nav-item">
                    <a class="nav-link{% if active_page == 'dashboard' %} active{% endif %}" href="/">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link{% if active_page == 'monitors' %} active{% endif %}" href="/monitors">Monitors</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link{% if active_page == 'changes' %} active{% endif %}" href="/changes">Changes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link{% if active_page == 'knowledge' %} active{% endif %}" href="/knowledge">Knowledge Base</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link{% if active_page == 'reports' %} active{% endif %}" href="/reports">Reports</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link{% if active_page == 'about' %} active{% endif %}" href="/about">About</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<main class="container pb-5 px-3 px-md-4">
    {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
