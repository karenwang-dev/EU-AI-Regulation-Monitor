{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h1 class="h3 mb-1">Manage Monitors</h1>
        <p class="text-muted mb-0">Add, edit, or remove monitoring sources without editing JSON manually.</p>
    </div>
    <button class="btn btn-primary" id="addMonitorBtn" type="button">+ Add Monitor</button>
</div>

<div id="alertContainer"></div>

<div class="card shadow-sm">
    <div class="table-responsive">
        <table class="table table-hover mb-0">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Frequency</th>
                    <th>Crawl Mode</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="monitorTableBody">
                <tr>
                    <td colspan="6" class="text-muted">Loading monitors...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<div class="modal fade" id="monitorModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form id="monitorForm">
                <div class="modal-header">
                    <h2 class="modal-title h5" id="monitorModalTitle">Add Monitor</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="monitorId">

                    <div class="mb-3">
                        <label for="monitorName" class="form-label">Name</label>
                        <input type="text" class="form-control" id="monitorName" required>
                    </div>

                    <div class="mb-3">
                        <label for="monitorUrl" class="form-label">URL</label>
                        <input type="url" class="form-control" id="monitorUrl" required>
                    </div>

                    <div class="mb-3">
                        <label for="monitorKeywords" class="form-label">Keywords (one per line)</label>
                        <textarea class="form-control" id="monitorKeywords" rows="4" required></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="monitorCategory" class="form-label">Category</label>
                            <select class="form-select" id="monitorCategory" required>
                                <option value="AI Regulation">AI Regulation</option>
                                <option value="Product Compliance">Product Compliance</option>
                                <option value="Cybersecurity">Cybersecurity</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="monitorFrequency" class="form-label">Frequency</label>
                            <select class="form-select" id="monitorFrequency" required>
                                <option value="daily">Daily</option>
                                <option value="weekly">Weekly</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="monitorCrawlMode" class="form-label">Crawl Mode</label>
                            <select class="form-select" id="monitorCrawlMode" required>
                                <option value="single">Single Page</option>
                                <option value="smart">Smart Discovery</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="monitorMaxDepth" class="form-label">Max Depth</label>
                            <input type="number" class="form-control" id="monitorMaxDepth" min="0" value="0" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="monitorMaxPages" class="form-label">Max Pages</label>
                            <input type="number" class="form-control" id="monitorMaxPages" min="1" value="1" required>
                        </div>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="monitorEnabled" checked>
                        <label class="form-check-label" for="monitorEnabled">Enabled</label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveMonitorBtn">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const monitorTableBody = document.getElementById("monitorTableBody");
const monitorModalElement = document.getElementById("monitorModal");
const monitorModal = new bootstrap.Modal(monitorModalElement);
const monitorForm = document.getElementById("monitorForm");
const alertContainer = document.getElementById("alertContainer");
let monitorsCache = [];

function showAlert(message, type = "danger") {
    alertContainer.innerHTML = `
        <div class="alert alert-${type} alert-dismissible fade show" role="alert">
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    `;
}

function formatFrequency(value) {
    return value.charAt(0).toUpperCase() + value.slice(1);
}

function formatCrawlMode(value) {
    if (value === "smart") {
        return "Smart Discovery";
    }
    return "Single Page";
}

function setCrawlDefaults() {
    document.getElementById("monitorCrawlMode").value = "single";
    document.getElementById("monitorMaxDepth").value = "0";
    document.getElementById("monitorMaxPages").value = "1";
}

function parseKeywords(text) {
    return text
        .split("\n")
        .map((item) => item.trim())
        .filter(Boolean);
}

function renderMonitors(monitors) {
    monitorsCache = monitors;

    if (!monitors.length) {
        monitorTableBody.innerHTML = `
            <tr>
                <td colspan="6" class="text-muted">No monitors configured.</td>
            </tr>
        `;
        return;
    }

    monitorTableBody.innerHTML = monitors.map((monitor) => `
        <tr>
            <td>${monitor.name}</td>
            <td>${monitor.category}</td>
            <td>${formatFrequency(monitor.frequency)}</td>
            <td>${formatCrawlMode(monitor.crawl_mode || "single")}</td>
            <td>
                ${monitor.enabled
                    ? '<span class="badge text-bg-success">ON</span>'
                    : '<span class="badge text-bg-secondary">OFF</span>'}
            </td>
            <td>
                <button class="btn btn-sm btn-outline-primary me-2 edit-monitor-btn"
                    data-id="${monitor.id}">
                    Edit
                </button>
                <button class="btn btn-sm btn-outline-danger delete-monitor-btn"
                    data-id="${monitor.id}">
                    Delete
                </button>
            </td>
        </tr>
    `).join("");

    document.querySelectorAll(".edit-monitor-btn").forEach((button) => {
        button.addEventListener("click", () => openEditModal(button.dataset.id));
    });

    document.querySelectorAll(".delete-monitor-btn").forEach((button) => {
        button.addEventListener("click", () => deleteMonitor(button.dataset.id));
    });
}

async function loadMonitors() {
    const response = await fetch("/api/monitors");
    if (!response.ok) {
        showAlert("Failed to load monitors.");
        return;
    }
    renderMonitors(await response.json());
}

function openCreateModal() {
    document.getElementById("monitorModalTitle").textContent = "Add Monitor";
    document.getElementById("monitorId").value = "";
    monitorForm.reset();
    document.getElementById("monitorEnabled").checked = true;
    setCrawlDefaults();
    monitorModal.show();
}

function openEditModal(monitorId) {
    const monitor = monitorsCache.find((item) => item.id === monitorId);
    if (!monitor) {
        showAlert("Monitor not found.");
        return;
    }

    document.getElementById("monitorModalTitle").textContent = "Edit Monitor";
    document.getElementById("monitorId").value = monitor.id;
    document.getElementById("monitorName").value = monitor.name;
    document.getElementById("monitorUrl").value = monitor.url;
    document.getElementById("monitorKeywords").value = monitor.keywords.join("\n");
    document.getElementById("monitorCategory").value = monitor.category;
    document.getElementById("monitorFrequency").value = monitor.frequency;
    document.getElementById("monitorCrawlMode").value = monitor.crawl_mode || "single";
    document.getElementById("monitorMaxDepth").value = monitor.max_depth ?? 0;
    document.getElementById("monitorMaxPages").value = monitor.max_pages ?? 1;
    document.getElementById("monitorEnabled").checked = monitor.enabled;
    monitorModal.show();
}

async function deleteMonitor(monitorId) {
    if (!confirm("Remove this monitor from the active monitoring list?")) {
        return;
    }

    const response = await fetch(`/api/monitors/${monitorId}`, {
        method: "DELETE",
    });

    if (!response.ok) {
        const error = await response.json();
        showAlert(error.detail || "Failed to delete monitor.");
        return;
    }

    showAlert("Monitor deleted successfully.", "success");
    await loadMonitors();
}

monitorForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    const monitorId = document.getElementById("monitorId").value;
    const payload = {
        name: document.getElementById("monitorName").value.trim(),
        url: document.getElementById("monitorUrl").value.trim(),
        keywords: parseKeywords(document.getElementById("monitorKeywords").value),
        category: document.getElementById("monitorCategory").value,
        frequency: document.getElementById("monitorFrequency").value,
        crawl_mode: document.getElementById("monitorCrawlMode").value,
        max_depth: Number(document.getElementById("monitorMaxDepth").value),
        max_pages: Number(document.getElementById("monitorMaxPages").value),
        enabled: document.getElementById("monitorEnabled").checked,
    };

    const isEdit = Boolean(monitorId);
    const response = await fetch(
        isEdit ? `/api/monitors/${monitorId}` : "/api/monitors",
        {
            method: isEdit ? "PUT" : "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(payload),
        }
    );

    if (!response.ok) {
        const error = await response.json();
        showAlert(error.detail || "Failed to save monitor.");
        return;
    }

    monitorModal.hide();
    showAlert(isEdit ? "Monitor updated successfully." : "Monitor created successfully.", "success");
    await loadMonitors();
});

document.getElementById("addMonitorBtn").addEventListener("click", openCreateModal);
loadMonitors();
</script>
{% endblock %}
